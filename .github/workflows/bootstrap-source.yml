name: Bootstrap PayNova Guard source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack GitHub-ready source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 > /tmp/paynova.zip.b64
          base64 -d /tmp/paynova.zip.b64 > /tmp/paynova.zip
          echo '9a23f09e12c431fb39d984d6675f8c78c41641484c6ba2d1453e1222609eff4d  /tmp/paynova.zip' | sha256sum -c -
          rm -rf .bootstrap-source
          mkdir -p .bootstrap-source
          unzip -q /tmp/paynova.zip -d .bootstrap-source
          cp -a .bootstrap-source/paynova-guard-hacxlerate-2026-github/. .
          rm -rf .bootstrap-source .bootstrap
          rm -f paynova-guard-hacxlerate-2026-github-upload.zip
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add PayNova Guard full-stack source'
          git push
